name: "issue-260 repro"

# Temporary branch-only harness for issue #260. Deleted once the root cause is known.
on:
  push:
    branches: [repro/issue-260]
  workflow_dispatch:

concurrency:
  group: issue-260-repro
  cancel-in-progress: true

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install debug tooling and Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdb gcc iproute2 libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libpango-1.0-0 \
            libcairo2 libxss1 libxtst6 libx11-xcb1 libegl1 libglib2.0-0t64 \
            xvfb xauth dbus dbus-x11 at-spi2-core libatspi2.0-0t64 fonts-liberation
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          node -v
          uname -a

      - name: Download and extract DSH NEXT 2.0.21-next (linux-x64)
        run: |
          curl -fL --retry 3 -o /tmp/dsh-next.tgz \
            https://github.com/anywhere-labs/deepseek-harness-desktop/releases/download/v2.0.21-next/DSH-NEXT-2.0.21-next-linux-x64.tar.gz
          mkdir -p /opt/dsh-next
          tar -xzf /tmp/dsh-next.tgz -C /opt/dsh-next --strip-components=1
          ls /opt/dsh-next | head
          echo '--- missing shared libraries (if any) ---'
          ldd /opt/dsh-next/dsh-desktop-next | grep 'not found' || true

      - name: Build the LD_PRELOAD poll tracer
        run: gcc -shared -fPIC -O2 -o /tmp/ppoll-hook.so .github/repro260/ppoll-hook.c -ldl

      - name: Prepare plugin package (npm 1.21.12)
        run: |
          mkdir -p /tmp/plugin
          npm pack dsh-bottom-info-bar@1.21.12 --pack-destination /tmp/plugin
          tar -xzf /tmp/plugin/dsh-bottom-info-bar-1.21.12.tgz -C /tmp/plugin
          ls /tmp/plugin/package | head

      - name: GUI control run - profile without the plugin
        env:
          APP_DIR: /opt/dsh-next
          APP_RESOURCES: /opt/dsh-next/resources
          ELECTRON_BIN: /opt/dsh-next/dsh-desktop-next
          ARCH: x64
          NEXT_HOME: ${{ runner.temp }}/next-home-off
          OUT_DIR: ${{ github.workspace }}/repro-out/off
          VARIANT: "off"
          RUNS: "2"
          COMPUTER_USE: "on"
          LD_PRELOAD: /tmp/ppoll-hook.so
          PPOLL_HOOK_OUT: /tmp/ppoll-hook.log
        run: dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" node .github/repro260/gui-driver.mjs

      - name: GUI repro run - profile with dsh-bottom-info-bar 1.21.12
        env:
          APP_DIR: /opt/dsh-next
          APP_RESOURCES: /opt/dsh-next/resources
          ELECTRON_BIN: /opt/dsh-next/dsh-desktop-next
          ARCH: x64
          NEXT_HOME: ${{ runner.temp }}/next-home-on
          OUT_DIR: ${{ github.workspace }}/repro-out/on
          VARIANT: "on"
          RUNS: "3"
          PLUGIN_SRC: /tmp/plugin/package
          DSH_BOTTOM_INFO_BAR_SELF_UPDATE: "off"
          DSH_BOTTOM_INFO_BAR_STARTUP_TRACE: "1"
          COMPUTER_USE: "on"
          LD_PRELOAD: /tmp/ppoll-hook.so
          PPOLL_HOOK_OUT: /tmp/ppoll-hook.log
        run: dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" node .github/repro260/gui-driver.mjs

      - name: Smoke-test collect-260.sh (healthy control)
        run: |
          COLLECT_HOME="$RUNNER_TEMP/next-collect-home"
          XDG="$RUNNER_TEMP/collect-config"
          mkdir -p "$XDG/DSH NEXT/home"
          mkdir -p "$COLLECT_HOME/profiles/desktop/node_modules"
          python3 - "$COLLECT_HOME" <<'SEED'
          import json, sys
          home = sys.argv[1]
          manifest = {
            "name": "dsh-profile-desktop", "private": True, "dependencies": {},
            "dsh": {"desktopNextPlugins": 1, "desktopNextScheduleBundle": 2,
                    "desktopNextOnboarding": {"version": 1, "outcome": "completed"},
                    "profile": {"bundles": ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app"]}},
          }
          open(home + "/profiles/desktop/package.json", "w").write(json.dumps(manifest, indent=2) + "\n")
          open(home + "/profiles/desktop/cordis.patch.yml", "w").write("[]\n")
          SEED
          echo '{"home": "'"$COLLECT_HOME"'"}' > "$XDG/DSH NEXT/home/desktop-next-last-home.json"
          chmod 600 "$XDG/DSH NEXT/home/desktop-next-last-home.json"
          export XDG_CONFIG_HOME="$XDG"
          COLLECT_APP_ARGS="--no-sandbox" dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" bash .github/repro260/collect-260.sh /opt/dsh-next/dsh-desktop-next "$COLLECT_HOME"
          ls -la /tmp/issue260-*/evidence.tar.gz
          tar -tzf /tmp/issue260-*/evidence.tar.gz | head -20

      - name: Summarize
        if: always()
        run: |
          for f in "${{ github.workspace }}"/repro-out/*/*-summary.json; do
            echo "=== $f ==="
            cat "$f" || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-260-repro-logs
          path: |
            repro-out
            /tmp/issue260-*/evidence.tar.gz
          retention-days: 14
          if-no-files-found: warn

  wayland:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install tooling, Electron and Wayland runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdb gcc iproute2 libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libpango-1.0-0 \
            libcairo2 libxss1 libxtst6 libx11-xcb1 libegl1 libglib2.0-0t64 \
            weston xwayland dbus dbus-x11 at-spi2-core libatspi2.0-0t64 fonts-liberation
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Download and extract DSH NEXT 2.0.21-next (linux-x64)
        run: |
          curl -fL --retry 3 -o /tmp/dsh-next.tgz \
            https://github.com/anywhere-labs/deepseek-harness-desktop/releases/download/v2.0.21-next/DSH-NEXT-2.0.21-next-linux-x64.tar.gz
          mkdir -p /opt/dsh-next
          tar -xzf /tmp/dsh-next.tgz -C /opt/dsh-next --strip-components=1

      - name: Build the LD_PRELOAD poll tracer
        run: gcc -shared -fPIC -O2 -o /tmp/ppoll-hook.so .github/repro260/ppoll-hook.c -ldl

      - name: Prepare plugin package (npm 1.21.12)
        run: |
          mkdir -p /tmp/plugin
          npm pack dsh-bottom-info-bar@1.21.12 --pack-destination /tmp/plugin
          tar -xzf /tmp/plugin/dsh-bottom-info-bar-1.21.12.tgz -C /tmp/plugin

      - name: Wayland control run (no plugin)
        env:
          APP_DIR: /opt/dsh-next
          APP_RESOURCES: /opt/dsh-next/resources
          ELECTRON_BIN: /opt/dsh-next/dsh-desktop-next
          ARCH: x64
          NEXT_HOME: ${{ runner.temp }}/next-wl-home-off
          OUT_DIR: ${{ github.workspace }}/repro-out/wl-off
          VARIANT: "off"
          RUNS: "2"
          COMPUTER_USE: "on"
          LD_PRELOAD: /tmp/ppoll-hook.so
          PPOLL_HOOK_OUT: /tmp/ppoll-hook.log
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg-wayland
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-0 --width=1280 --height=800 --idle-time=0 > /tmp/weston.log 2>&1 &
          sleep 3
          export WAYLAND_DISPLAY=wayland-0
          unset DISPLAY
          export APP_EXTRA_ARGS="--ozone-platform=wayland"
          dbus-run-session -- node .github/repro260/gui-driver.mjs

      - name: Wayland repro run (plugin 1.21.12)
        env:
          APP_DIR: /opt/dsh-next
          APP_RESOURCES: /opt/dsh-next/resources
          ELECTRON_BIN: /opt/dsh-next/dsh-desktop-next
          ARCH: x64
          NEXT_HOME: ${{ runner.temp }}/next-wl-home-on
          OUT_DIR: ${{ github.workspace }}/repro-out/wl-on
          VARIANT: "on"
          RUNS: "3"
          PLUGIN_SRC: /tmp/plugin/package
          COMPUTER_USE: "on"
          DSH_BOTTOM_INFO_BAR_SELF_UPDATE: "off"
          DSH_BOTTOM_INFO_BAR_STARTUP_TRACE: "1"
          LD_PRELOAD: /tmp/ppoll-hook.so
          PPOLL_HOOK_OUT: /tmp/ppoll-hook.log
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg-wayland
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-0 --width=1280 --height=800 --idle-time=0 > /tmp/weston.log 2>&1 &
          sleep 3
          export WAYLAND_DISPLAY=wayland-0
          unset DISPLAY
          export APP_EXTRA_ARGS="--ozone-platform=wayland"
          dbus-run-session -- node .github/repro260/gui-driver.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-260-wayland-logs
          path: |
            repro-out
            /tmp/weston.log
          retention-days: 14
          if-no-files-found: warn

  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download DSH NEXT and pack the plugin on the host
        run: |
          curl -fL --retry 3 -o /tmp/dsh-next.tgz \
            https://github.com/anywhere-labs/deepseek-harness-desktop/releases/download/v2.0.21-next/DSH-NEXT-2.0.21-next-linux-x64.tar.gz
          mkdir -p /tmp/plugin
          npm pack dsh-bottom-info-bar@1.21.12 --pack-destination /tmp/plugin
          tar -xzf /tmp/plugin/dsh-bottom-info-bar-1.21.12.tgz -C /tmp/plugin
          mkdir -p "$GITHUB_WORKSPACE/repro-out"

      - name: Run both variants inside Arch Linux (glib 2.90 like the reporter)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v /tmp/dsh-next.tgz:/dsh-next.tgz:ro \
            -v /tmp/plugin/package:/plugin:ro \
            -w /work \
            -e COMPUTER_USE=on \
            archlinux:latest bash -lc '
              set -e
              pacman -Syu --noconfirm --quiet
              pacman -S --noconfirm --quiet --needed nodejs npm gcc dbus xorg-server-xvfb xorg-xauth \
                at-spi2-core gtk3 nss alsa-lib libxcomposite libxdamage libxfixes libxrandr \
                libxkbcommon libcups pango cairo libxss libxtst libxi libx11 libegl mesa wayland
              mkdir -p /opt/dsh-next
              tar -xzf /dsh-next.tgz -C /opt/dsh-next --strip-components=1
              node -v
              gcc -shared -fPIC -O2 -o /tmp/ppoll-hook.so .github/repro260/ppoll-hook.c -ldl
              export APP_DIR=/opt/dsh-next
              export APP_RESOURCES=/opt/dsh-next/resources
              export ELECTRON_BIN=/opt/dsh-next/dsh-desktop-next
              export ARCH=x64
              export LD_PRELOAD=/tmp/ppoll-hook.so
              export PPOLL_HOOK_OUT=/tmp/ppoll-hook.log
              export DSH_BOTTOM_INFO_BAR_SELF_UPDATE=off
              export DSH_BOTTOM_INFO_BAR_STARTUP_TRACE=1
              export XDG_RUNTIME_DIR=/tmp/xdg; mkdir -p /tmp/xdg; chmod 700 /tmp/xdg
              VARIANT=off RUNS=2 NEXT_HOME=/tmp/home-off OUT_DIR=/work/repro-out/arch-off \
                dbus-run-session -- xvfb-run -a node .github/repro260/driver.mjs
              VARIANT=on RUNS=3 NEXT_HOME=/tmp/home-on OUT_DIR=/work/repro-out/arch-on PLUGIN_SRC=/plugin \
                dbus-run-session -- xvfb-run -a node .github/repro260/driver.mjs
              export APP_EXTRA_ARGS=""
              export DSH_BOTTOM_INFO_BAR_SELF_UPDATE=off
              VARIANT=off RUNS=2 NEXT_HOME=/tmp/home-gui-off OUT_DIR=/work/repro-out/arch-gui-off \
                dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" node .github/repro260/gui-driver.mjs
              VARIANT=on RUNS=3 NEXT_HOME=/tmp/home-gui-on OUT_DIR=/work/repro-out/arch-gui-on PLUGIN_SRC=/plugin \
                dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" node .github/repro260/gui-driver.mjs
            '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-260-arch-logs
          path: repro-out
          retention-days: 14
          if-no-files-found: warn

  extras:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb gcc iproute2 libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libpango-1.0-0 libcairo2 libxss1 libxtst6 libx11-xcb1 libegl1 libglib2.0-0t64 dbus dbus-x11 at-spi2-core libatspi2.0-0t64

      - name: Download DSH NEXT
        run: |
          curl -fL --retry 3 -o /tmp/dsh-next.tgz \
            https://github.com/anywhere-labs/deepseek-harness-desktop/releases/download/v2.0.21-next/DSH-NEXT-2.0.21-next-linux-x64.tar.gz
          mkdir -p /opt/dsh-next
          tar -xzf /tmp/dsh-next.tgz -C /opt/dsh-next --strip-components=1

      - name: Pack the reporter's other 14 plugins (installed but not in bundles)
        run: |
          PLUGINS="@agents-anywhere/dsh-bridge-next dshmarket dsh-better-sidebar @copylee/dsh-better-display dsh-auto-memory dsh-ds-balance dsh-persona-dafeiyu @michengai/dsh-skills-manager @max-null/dsh-chinese-thinking dsh-improved-inline-edit dsh-anim-settings dsh-netmon dsh-codex-effort-slider dsh-opencode-palette"
          for p in $PLUGINS; do
            dest="/tmp/extras/$p"
            mkdir -p "$(dirname "$dest")"
            tmp=$(mktemp -d)
            ( cd "$tmp" && npm pack "$p" --silent >/dev/null 2>&1 && tar -xzf ./*.tgz && mv package "$dest" ) || echo "skip $p"
            rm -rf "$tmp"
          done
          ls /tmp/extras | head

      - name: Prepare plugin package (npm 1.21.12)
        run: |
          mkdir -p /tmp/plugin
          npm pack dsh-bottom-info-bar@1.21.12 --pack-destination /tmp/plugin
          tar -xzf /tmp/plugin/dsh-bottom-info-bar-1.21.12.tgz -C /tmp/plugin

      - name: Run with 15 installed plugins, only 3 bundles (reporter's minimal repro state)
        env:
          APP_DIR: /opt/dsh-next
          APP_RESOURCES: /opt/dsh-next/resources
          ELECTRON_BIN: /opt/dsh-next/dsh-desktop-next
          ARCH: x64
          NEXT_HOME: ${{ runner.temp }}/next-home-extras
          OUT_DIR: ${{ github.workspace }}/repro-out/extras
          VARIANT: "on"
          RUNS: "3"
          PLUGIN_SRC: /tmp/plugin/package
          COMPUTER_USE: "on"
          EXTRA_PLUGINS_SRC: /tmp/extras
          EXTRA_PLUGINS: "@agents-anywhere/dsh-bridge-next,dshmarket,dsh-better-sidebar,@copylee/dsh-better-display,dsh-auto-memory,dsh-ds-balance,dsh-persona-dafeiyu,@michengai/dsh-skills-manager,@max-null/dsh-chinese-thinking,dsh-improved-inline-edit,dsh-anim-settings,dsh-netmon,dsh-codex-effort-slider,dsh-opencode-palette"
          DSH_BOTTOM_INFO_BAR_SELF_UPDATE: "off"
          DSH_BOTTOM_INFO_BAR_STARTUP_TRACE: "1"
        run: dbus-run-session -- xvfb-run -a node .github/repro260/driver.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-260-extras-logs
          path: repro-out
          retention-days: 14
          if-no-files-found: warn
