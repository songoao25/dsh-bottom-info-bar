# DeepSeek 价目自动更新（pricing-watch）
#
# 每小时匿名读一次 DeepSeek 官方价目页（英文/USD + 中文/CNY）与 Change Log，
# scripts/pricing-watch.mjs 严格解析 + 全部校验通过后才更新 catalog/pricing.json；
# 任一环节失败 → 整批拒绝、不写目录，并在仓库开一个去重后的 issue 告警。
#
# 目录更新走 PR，不直接推送：main 分支受保护（要求 PR + CI），直接 push 会被
# GH006 拒绝（#328 的教训：抓取器明明通过，推送一步失败还误报成“校验失败”）。
# 流程：固定分支 pricing-watch/catalog → 以仓库拥有者身份建 PR
# （RELEASE_PLEASE_TOKEN）→ auto-merge-own 在 CI 通过后自动合入。
# chore(pricing) 提交不触发 release-please 发版；校验本身已在脚本内完成。
#
# 设计依据：RESEARCH-deepseek-auto-pricing-20261127.md §7（CI 抓取器 + 现有目录通道）。
# 权限：contents: write（推分支、建 PR）与 issues: write（失败告警）。
name: Pricing Watch

on:
  schedule:
    - cron: '7 * * * *' # 每小时（错开整点）
    - cron: '0 0 15 11 *' # 每年 11 月 15 日：节假日表年度闹钟
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（只校验、不提交目录）'
        type: boolean
        default: false
      run_holiday_check:
        description: '同时跑一次节假日表检查（平时仅 11 月 15 日自动跑）'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: pricing-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run pricing watch
        id: watch
        run: |
          # pipefail：不加的话 tee 会吃掉抓取器的非零退出码，失败告警步永远不触发
          set -o pipefail
          node scripts/pricing-watch.mjs --catalog catalog/pricing.json ${{ inputs.dry_run == true && '--dry-run' || '' }} | tee "$RUNNER_TEMP/watch.json"
      - name: Open catalog update PR
        if: steps.watch.outcome == 'success'
        env:
          # owner PAT：以仓库拥有者身份建 PR，auto-merge-own 才会自动合入；
          # 回退到 GITHUB_TOKEN 时作者为 github-actions[bot]，PR 会停留在待人工合入，
          # 建完后按作者检查并打 warning（见本步末尾）。
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! git status --porcelain -- catalog/pricing.json | grep -q .; then
            echo '目录无变化，不提交。'
            exit 0
          fi
          node -e "
            const fs = require('node:fs');
            const s = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/watch.json', 'utf8'));
            let msg;
            if (s.status === 'stamp') {
              msg = 'chore(pricing): daily verification stamp (pricing-watch)\n\n官方价目页无变化；本次仅更新 checkedAt 验讫戳。\nsourceHash: ' + s.sourceHash + '\n';
            } else {
              const lines = s.changes.length > 0 ? s.changes.map(function (c) { return '- ' + c; }) : ['- 价格与规则均无变化（仅 meta 更新）'];
              if (s.warnings.length > 0) lines.push('', '警告：', ...s.warnings.map(function (w) { return '- ' + w; }));
              if (s.changelogNote) lines.push('', s.changelogNote);
              lines.push('sourceHash: ' + s.sourceHash, 'ruleHash: ' + s.ruleHash);
              msg = 'chore(pricing): auto-update DeepSeek catalog (pricing-watch)\n\n' + lines.join('\n') + '\n';
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + '/commit-msg.txt', msg);
          "
          BRANCH='pricing-watch/catalog'
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo '已有未合并的 pricing PR，跳过本轮（等它合入后，下一轮再按新 checkedAt 走）。'
            exit 0
          fi
          git config user.name 'dsh-bottom-info-bar pricing-watch'
          git config user.email 'pricing-watch@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add catalog/pricing.json
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          # 旧分支残留（上一轮 PR 已合入但分支未删）先清掉，再干净推送，不用 --force。
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git push -u origin "$BRANCH"
          TITLE="$(head -n 1 "$RUNNER_TEMP/commit-msg.txt")"
          BODY="$(tail -n +3 "$RUNNER_TEMP/commit-msg.txt")

          pricing-watch 自动提交，只改 catalog/pricing.json，不碰插件代码；chore 提交不触发 release-please 发版。CI 通过后由 auto-merge 自动合入。"
          PR_URL="$(gh pr create --head "$BRANCH" --base main --title "$TITLE" --body "$BODY")"
          echo "pricing PR: $PR_URL"
          OWNER="$(gh repo view --json owner --jq '.owner.login')"
          AUTHOR="$(gh pr view "$PR_URL" --json author --jq '.author.login')"
          if [ "$AUTHOR" != "$OWNER" ]; then
            echo "::warning::pricing PR 作者为 $AUTHOR（非仓库拥有者），auto-merge 不会自动合入，需人工合入：$PR_URL"
          fi
      - name: Open failure issue (deduped by open issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh issue list --label pricing-watch-failure --state open --json number --jq 'length')" != "0" ]; then
            echo '已有未关闭的 pricing-watch-failure issue，不重复开。'
            exit 0
          fi
          TITLE="pricing-watch 校验失败（$(date -u +%Y-%m-%d)）"
          BODY="pricing-watch 校验失败，整批已拒绝，目录未改动（上一份可用目录继续生效，用户侧零感知）。"
          if [ -f "$RUNNER_TEMP/watch.json" ]; then
            # 摘要存在且 status 不是 failed，说明抓取与校验已通过，失败在提交/PR 阶段，
            # 别再误报成“校验失败”（#328 的教训）。
            STATUS="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.env.RUNNER_TEMP + '/watch.json', 'utf8')).status)")"
            if [ "$STATUS" != "failed" ]; then
              TITLE="pricing-watch 推送失败（$(date -u +%Y-%m-%d)）"
              BODY="pricing-watch 抓取与校验均已通过（摘要 status=$STATUS），失败发生在提交/PR 阶段，目录未改动（上一份可用目录继续生效，用户侧零感知）。详见本次 Action 日志 Open catalog update PR 一步。"
            fi
            BODY="$BODY

          摘要：$(cat "$RUNNER_TEMP/watch.json")"
          else
            BODY="$BODY

          抓取器未产出摘要（可能在抓取阶段即失败），详见本次 Action 日志。"
          fi
          gh issue create --label pricing-watch-failure \
            --title "$TITLE" --body "$BODY"

  holiday-alarm:
    # 年度闹钟：每年 11 月 15 日检查节假日表是否覆盖次年；覆盖不足即开 issue 提醒补表。
    # 国务院次年安排的公文 URL 每年都变、无法提前拼出，故本任务不猜 URL：
    # 覆盖不足本身就是开 issue 的充分条件，issue 正文附 gov.cn 检索入口。
    if: github.event.schedule == '0 0 15 11 *' || inputs.run_holiday_check == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check holiday table coverage
        id: check
        run: |
          node -e "
            const fs = require('node:fs');
            const catalog = JSON.parse(fs.readFileSync('catalog/pricing.json', 'utf8'));
            const nextYear = new Date().getUTCFullYear() + 1;
            const through = (catalog.meta && catalog.meta.holidaysThrough) || 0;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'next_year=' + nextYear + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'holidays_through=' + through + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'needs_issue=' + (through < nextYear) + '\n');
            console.log('nextYear=' + nextYear + ' holidaysThrough=' + through + ' needsIssue=' + (through < nextYear));
          "
      - name: Open holiday issue (deduped by open issue)
        if: steps.check.outputs.needs_issue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh issue list --label holiday-table --state open --json number --jq 'length')" != "0" ]; then
            echo '已有未关闭的 holiday-table issue，不重复开。'
            exit 0
          fi
          gh issue create --label holiday-table \
            --title "节假日表只到 ${{ steps.check.outputs.holidays_through }} 年，请补 ${{ steps.check.outputs.next_year }} 年安排" \
            --body "国务院办公厅已发布（或即将发布）${{ steps.check.outputs.next_year }} 年部分节假日安排，请按公文补一行日期到 src/accounting.js 的 CHINESE_PUBLIC_HOLIDAYS（不是改逻辑），补完后 pricing-watch 下一轮会自动把 catalog meta 的 holidaysThrough 同步过去。

          公文检索：https://www.gov.cn/zhengce/ 搜索「${{ steps.check.outputs.next_year }}年部分节假日安排的通知」。

          影响：该年假期工作日在此之前会按高峰价多算一倍；插件设置页价目行已有过期提示兜底。"
