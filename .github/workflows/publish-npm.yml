name: Publish NPM package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      verify_only:
        description: Check public npm availability without publishing again
        type: boolean
        default: false
      version:
        description: Exact release version to verify (defaults to package.json)
        type: string
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish dsh-bottom-info-bar to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$package_version" ]; then
              echo "Tag version $tag_version does not match package version $package_version"
              exit 1
            fi
          else
            echo "Manual publish: using package version $package_version"
          fi

      # prepublishOnly 会先 npm run build，保证 npm 包里的 lib/ 与 src/ 一致
      - name: Publish package
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify public npm release
        run: node scripts/verify-npm-publication.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_RELEASE_VERSION: ${{ inputs.version || '' }}
          NPM_VERIFY_TIMEOUT_MS: ${{ inputs.verify_only == true && '0' || '' }}
