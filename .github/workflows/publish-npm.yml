name: Publish NPM package

# 这个 job 的契约只有一条：**只发不等**。
#
# npm 的发布是异步的：`npm publish` 返回 0 只代表「已受理」，版本要等服务端扫描/校验
# （生命周期状态 validating）结束后才会公开可下载。实测「上传完成 → 公开可下载」的延迟：
#   2026-09-26  v1.20.4~v1.20.8   74s ~ 157s
#   2026-09-30  v1.20.9           1098s（≈18 分钟）
#   2026-09-30  v1.20.10          >25 分钟
#
# 一旦把「等它公开」写进这个 job，发包耗时就等于 npm 的服务端队列耗时 ——
# 2026-09-30 v1.20.10 正是这样从几十秒变成十几分钟、并且常常判红的。
#
# 公开可用性改由独立的 verify-npm-release.yml 后台读回校验，不阻塞这里。
#
# 认证：**没有长期密钥**，走 npm 可信发布（Trusted Publishing / OIDC）。
# 背景（2026-10-13）：npm 自 2025-11 起只支持带到期日的 granular token，并要求发布过 2FA
# 或使用勾了 Bypass 2FA 的令牌。本仓库原来的 NPM_TOKEN 已被 npm 拒绝 —— 姊妹仓库
# dsh-chatgpt-sub 在 2026-10-10 用同样的方式连试四次（tag 触发 + 手动触发）全部失败，
# 改成可信发布后才恢复。本仓库自 2026-10-07 之后没发过版，所以还没撞上。
# 现在由 job 申请 id-token: write，npm CLI 自动把 GitHub 签发的 OIDC token 换成一次性发布凭证，
# 不再需要任何长期密钥（也就不会再过期、泄漏或被撤销）。
#
# 前置条件（包所有者在 npmjs.com 配一次，配错时下面的 Check 步骤会明确报错）：
#   包 dsh-bottom-info-bar → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: songoao25
#     Repository:            dsh-bottom-info-bar
#     Workflow filename:     publish-npm.yml   （只填文件名，必须带 .yml）
#     Environment name:      留空
#     Allowed actions:       勾上允许 npm publish（不能只留 stage publish）
# 可信发布要求 npm CLI ≥ 11.5.1、Node ≥ 22.14，所以这里固定 Node 24。
on:
  push:
    tags:
      - 'v*.*.*'
  # 手动兜底：自动链断了还能人工发版（幂等，重跑已发布版本不会判红）。
  workflow_dispatch:

permissions:
  # OIDC：可信发布需要 job 能签发 id-token；其余权限保持只读。
  id-token: write
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish dsh-bottom-info-bar to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 可信发布要求 npm CLI ≥ 11.5.1、Node ≥ 22.14（Node 20 自带 npm 10 不支持 OIDC）。
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$package_version" ]; then
              echo "Tag version $tag_version does not match package version $package_version"
              exit 1
            fi
          fi
          echo "Releasing dsh-bottom-info-bar@$package_version"

      # prepublishOnly 会先 npm run build，保证 npm 包里的 lib/ 与 src/ 一致。
      # 早失败、说清原因：缺 id-token 权限时 npm 只会给出含糊的 ENEEDAUTH，这里直接点破。
      - name: Check OIDC publishing environment
        shell: bash
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token request is unavailable. Add 'permissions: id-token: write' to this workflow."
            exit 1
          fi

      - name: Publish package
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          # 幂等 1：版本已经在 npm 上，直接跳过（重跑旧标签不该报红）。
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "::notice::${package_name}@${version} 已经在 npm 上，跳过发布。"
            exit 0
          fi

          if output="$(npm publish --access public 2>&1)"; then
            printf '%s\n' "$output"
            echo "::notice::npm 已受理 ${package_name}@${version}。服务端校验是异步的（通常 1~2 分钟，偶发十几分钟），公开可用性由 Verify npm release 工作流后台读回确认。"
            exit 0
          else
            status=$?
          fi
          printf '%s\n' "$output"

          # 幂等 2：版本正在 npm 服务端 validating 时重复 publish 会 403。
          # 那说明包已经在 npm 手上了，不是发布失败。
          if printf '%s' "$output" | grep -q "cannot publish over the previously published versions"; then
            echo "::notice::${package_name}@${version} 已存在或正在 npm 服务端处理中，按幂等处理。"
            exit 0
          fi
          exit "$status"
